apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-container-hardening
spec:
  validationFailureAction: Enforce
  rules:
    - name: require-hardened-security-context
      match:
        any:
        - resources:
            kinds: [Pod]
      exclude:
        any:
        - resources:
            namespaces: [kube-system, kyverno, kube-node-lease, kube-public]
      validate:
        message: "Containers must run non-root, drop ALL capabilities, disable privilege escalation, and use read-only root filesystems."
        pattern:
          spec:
            =(automountServiceAccountToken): false
            containers:
              - securityContext:
                  runAsNonRoot: true
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL

    - name: disallow-default-serviceaccount
      match:
        any:
        - resources:
            kinds: [Pod]
      exclude:
        any:
        - resources:
            namespaces: [kube-system, kyverno, kube-node-lease, kube-public]
      validate:
        message: "Workloads must declare a dedicated ServiceAccount and cannot use 'default'."
        deny:
          conditions:
            any:
            - key: "{{ request.object.spec.serviceAccountName || '' }}"
              operator: In
              value: ["default", ""]
