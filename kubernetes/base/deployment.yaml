apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: M-treat-project
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: M-treat-project
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secrets
          image: everyday-is-devops-day-frontend:sha-a123
          imagePullPolicy: IfNotPresent

          # 1. Graceful Termination Hook
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2

          # 2. Tuned Readiness Probe
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1

          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
