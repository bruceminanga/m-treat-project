# Kubernetes/base/frontend/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Governance:
  - resourcequota.yaml
  - limitrange.yaml

  # Security & Firewall:
  - networkpolicy.yaml

  # Config & Secrets:
  - configmap.yaml
  - secret.yaml

  # Traffic & Ingress:
  - service.yaml
  - ingress.yaml

  # Core Workload:
  - deployment.yaml

  # Autoscaling & Resilience:
  - hpa.yaml
  - pdb.yaml

# Common metadata applied to all resources in base
commonLabels:
  app.kubernetes.io/name: my-app
  app.kubernetes.io/managed-by: kustomize
