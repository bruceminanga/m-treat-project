# Kubernetes/base/frontend/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Governance:
  - resourcequota.yaml
  - limitrange.yaml

  # Security & Firewall:
  - networkpolicy.yaml

  # Config & Secrets:
  - configmap.yaml
  - secret.yaml

  # Traffic & Ingress:
  - service.yaml

  # Core Workload:
  - deployment.yaml

  # Autoscaling & Resilience:
  - hpa.yaml
  - pdb.yaml

  # Observability stack:
  # - prometheusrule.yaml
  # - servicemonitor.yaml

# Modern way to automatically inject labels across all resources above:
labels:
  - pairs:
      app.kubernetes.io/name: M-treat-project #Overal project name
      app.kubernetes.io/component: frontend
      app.kubernetes.io/managed-by: kustomize
    # includeSelectors: true # Automatically generates and matches selectors in Deployment, Service, PDB, etc.
    includeTemplates: true # Automatically injects labels into Pod templates
