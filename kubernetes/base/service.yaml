# Kubernetes/base/frontend/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    # Match the labels defined on your Pods:
    app.kubernetes.io/name: M-treat-project
    app.kubernetes.io/component: frontend
