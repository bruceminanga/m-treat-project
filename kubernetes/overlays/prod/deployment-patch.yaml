apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend # No namespace here — Kustomization sets it
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: M-treat-project
      app.kubernetes.io/component: frontend
  template:
    spec:
      # ========================================================================
      # POD ANTI-AFFINITY (Soft / Preferred for 1-node compatibility)
      # ========================================================================
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: M-treat-project
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
