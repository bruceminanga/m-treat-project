name: "Terraform CI/CD"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # STEP 1: Fast Syntax & Formatting Check (Runs in ~5 seconds, no AWS needed)
  validate:
    name: "Validate Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Formatting
        run: terraform fmt -check

      # -backend=false allows init without needing S3 credentials
      - name: Terraform Init (Validation only)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # STEP 2: Deploy to Real AWS (Only runs when code is merged into 'main')
  deploy-production:
    name: "Deploy to Production"
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsDeploymentRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file="prod.tfvars"
